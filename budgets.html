<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toolkit Pro</title><link rel="preconnect" href="https://dpgkabvyappujokiujoh.supabase.co" crossorigin><link rel="stylesheet" href="assets/app.css?v=20261101"><script src="assets/vendor/supabase.js?v=20261101"></script><script src="assets/app.js?v=20261101"></script></head><body><script>
boot('Budgets',async m=>{
 const{t,b}=await load(),mo=today().slice(0,7);
 m.innerHTML=`<div class=card><h3>Add monthly budget</h3><form class=f id=f><input name=category placeholder="Expense category (as used in transactions)" required><input name=monthly_limit type=number min=1 placeholder="Monthly limit (₹)" required><button>Save budget</button></form></div>
 <div class=card><h3>This month (${mo})</h3><table><tr><th>Category<th class=r>Limit<th class=r>Spent<th>Used<th></tr>${b.map(x=>{const s=spent(t,x.category,mo);return`<tr><td>${esc(x.category)}<td class=r>${inr(x.monthly_limit)}<td class="r ${s>x.monthly_limit?'dn':''}">${inr(s)}<td>${bar(s,x.monthly_limit)}<small class=k>${Math.round(s/x.monthly_limit*100)}%</small><td><button class=g data-e="${x.id}">Edit</button><button class=x data-id="${x.id}">Delete</button></tr>`}).join('')||'<tr><td colspan=5>No budgets yet. Spending is matched by expense category.</tr>'}</table></div>`;
 $('#f').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData($('#f')));if(await ok(db.from('budgets').insert({category:d.category,monthly_limit:+d.monthly_limit}))){$('#f').reset();refresh()}};
 m.querySelectorAll('[data-e]').forEach(x=>x.onclick=()=>editBox('Edit budget',[{n:'category',l:'Expense category',req:1,full:1},{n:'monthly_limit',l:'Monthly limit (₹)',t:'number',min:1,step:'0.01',req:1,full:1}],b.find(y=>y.id===x.dataset.e),d=>ok(db.from('budgets').update({category:d.category,monthly_limit:+d.monthly_limit}).eq('id',x.dataset.e))).then(()=>refresh()));
 m.querySelectorAll('.x').forEach(x=>x.onclick=async()=>{if(confirm('Delete this budget?')&&await ok(db.from('budgets').delete().eq('id',x.dataset.id)))refresh()});
});
</script></body></html>
