<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toolkit Pro</title><link rel="preconnect" href="https://dpgkabvyappujokiujoh.supabase.co" crossorigin><link rel="stylesheet" href="assets/app.css?v=20261031"><script src="assets/vendor/supabase.js?v=20261031"></script><script src="assets/app.js?v=20261031"></script><script src="assets/gst-fields.js?v=20261031"></script><script src="assets/pdf.js?v=20261031"></script></head><body><script>
const id=Q.get('id'),sk=Q.get('kind')==='purchase'?'purchase':'sale';
boot('Invoice',async function render(m){
 const{i,p,t,a,S}=await load(),x=i.find(y=>y.id===id),IT=await db.from('invoice_items').select('*').eq('invoice_id',id).order('line_no'),items=IT.error?[]:(IT.data||[]),H=x?await loadHeads(x.kind,x.gl_account_id):{on:false,heads:[],name:()=>''};
 if(!x){m.innerHTML='<div class=card>Not found. <a href="invoices.html?kind='+sk+'">Back to list</a></div>';return}
 const sale=x.kind==='sale',P=p.find(y=>y.id===x.party_id)||{},pays=t.filter(y=>y.invoice_id===id).sort((u,v)=>u.date<v.date?-1:1),o=rup(paise(x.amount)-paise(x.paid)-paise(x.adjusted)),rt=+x.gst_rate||0,tv=x.taxable==null?null:+x.taxable;
 $('h1').textContent=(sale?'Invoice ':'Bill ')+x.number;
 const row=(k,v,b)=>`<tr><td>${b?'<b>'+k+'</b>':k}<td class=r>${b?'<b>'+v+'</b>':v}</tr>`;
 m.innerHTML=`<div class=noprint><a href="invoices.html?kind=${x.kind}">← Back to list</a> &nbsp;${badge(x)}</div>
 <div class="row c21"><div class=card><h3><a href="party.html?id=${x.party_id}&kind=${sale?'client':'supplier'}">${esc(P.name)}</a></h3><p class=k>${esc(P.gstin?'GSTIN '+P.gstin:'')} ${esc(P.state||'')}<br>Date ${x.date}${x.due_date?' · Due '+x.due_date:''}</p>
  <table>${tv==null?row('Amount (no GST breakup)',inr2(x.amount)):row('Taxable value',inr2(tv))+(x.igst>0?row('IGST ('+rt+'%)',inr2(x.igst)):(x.cgst>0||x.sgst>0)?row('CGST ('+rt/2+'%)',inr2(x.cgst))+row('SGST ('+rt/2+'%)',inr2(x.sgst)):row('GST (0%)',inr2(0)))}${H.on||x.gl_account_id?row(sale?'Income head':'Expense head',esc(x.gl_account_id?H.name(x.gl_account_id)||'(custom head)':(sale?'Sales':'Purchases')+' (default)')):''}${row('Total',inr2(x.amount),1)}${row(sale?'Received':'Paid',inr2(x.paid))}${+x.adjusted>0?row('Credit/debit notes and TDS',inr2(x.adjusted)):''}${x.itc_blocked?row('Input tax credit','Not allowed (GST is part of cost)'):''}${row('Balance due',inr2(o),1)}</table></div>
 <div class="card noprint"><h3>${sale?'Record receipt':'Record payment'}</h3>${o>0.005?`<form id=pf class=g2><label>Amount (₹)<input name=amount type=number step=0.01 min=0.01 max="${o}" value="${o}" required></label><label>Date<input type=date name=date value="${today()}" required></label><label class=full>${sale?'Deposit into':'Pay from'}<select name=account_id>${a.map(y=>`<option value="${y.id}">${esc(y.name)}`).join('')||'<option value="">No account (add one under Banking)'}</select></label><div class="f2 full"><button>Save</button></div></form>`:'<p class=up>Fully settled.</p>'}
  <p><button class=g id=ml>Email ${sale?'reminder':'update'}</button> <button class=g id=pr>Print</button> ${sale?'<button class=g id=pdf>Download PDF</button> <button id=shr>Share PDF</button> ':''}<button class=g id=ed>Edit</button> ${tv==null?'<button class=g id=gs>Set GST</button> ':''}<button class=x id=dl>Delete</button></p>
  <p class=noprint><a class=btn href="notes.html?invoice=${x.id}">${sale?'Issue credit note':'Issue debit note'}</a> <a class=btn href="tds.html?invoice=${x.id}">Record TDS</a> ${sale?'':`<button class=g id=itc>${x.itc_blocked?'Allow ITC':'Mark ITC not allowed'}</button>`}</p></div></div>
 ${items.length?`<div class=card><h3>Items</h3><div style="overflow:auto"><table><tr><th>#<th>Description<th>HSN/SAC<th class=r>Qty<th class=r>Rate<th class=r>Disc.<th class=r>GST<th class=r>Taxable</tr>${items.map(l=>`<tr><td>${l.line_no}<td>${esc(l.description)}<td>${esc(l.hsn_sac||'')}<td class=r>${+l.quantity}${l.unit?' '+esc(l.unit):''}<td class=r>${inr2(l.rate)}<td class=r>${+l.discount>0?inr2(l.discount):''}<td class=r>${+l.gst_rate}%<td class=r>${inr2(l.taxable)}</tr>`).join('')}</table></div></div>`:''}
 <div class=card><h3>Payments</h3><table><tr><th>Date<th>Account<th class=r>Amount<th class=noprint></tr>${pays.map(y=>`<tr><td>${y.date}<td>${esc(a.find(z=>z.id===y.account_id)?.name)}<td class=r>${inr2(y.amount)}<td class=noprint><button class=x data-id="${y.id}">Delete</button></tr>`).join('')||'<tr><td colspan=4>No payments yet.</tr>'}</table></div>`;
 if($('#pf'))$('#pf').onsubmit=e=>{e.preventDefault();const pf=$('#pf');return guard(pf,async()=>{const d=Object.fromEntries(new FormData(pf)),amt=rup(paise(d.amount));if(!(amt>0)||paise(amt)>paise(o))return alert('Enter an amount up to the balance due.');
  if(await lockedBlock(d.date))return;
  const desc=(sale?'Receipt ':'Payment ')+x.number+' - '+(P.name||''),rp=await db.rpc('record_payment',{p_invoice:x.id,p_amount:amt,p_date:d.date,p_account:d.account_id||null,p_description:desc});
  if(!rp.error){render(m);return}if(!noFn(rp.error))return alert(rp.error.message);
  const ins=await db.from('transactions').insert({date:d.date,description:(sale?'Receipt ':'Payment ')+x.number+' - '+(P.name||''),category:sale?'Sales':'Purchases',type:sale?'income':'expense',amount:amt,account_id:d.account_id||null,invoice_id:x.id}).select().single();
  if(ins.error)return alert(ins.error.message);
  if(!(await ok(db.from('invoices').update({paid:rup(paise(x.paid)+paise(amt))}).eq('id',x.id)))){await db.from('transactions').delete().eq('id',ins.data.id);return}
  render(m)})};
 m.querySelectorAll('.x[data-id]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this payment?'))return;const y=pays.find(z=>z.id===b.dataset.id);if(await lockedBlock(y.date))return;const rd=await db.rpc('delete_payment',{p_txn:y.id});if(!rd.error){render(m);return}if(!noFn(rd.error)){alert(rd.error.message);return}
  const np=Math.max(0,rup(paise(x.paid)-paise(y.amount)));if(!(await ok(db.from('invoices').update({paid:np}).eq('id',x.id))))return;if(!(await ok(db.from('transactions').delete().eq('id',y.id)))){await db.from('invoices').update({paid:x.paid}).eq('id',x.id)}render(m)});
 $('#ml').onclick=()=>mail(P.email,(sale?'Payment reminder: invoice ':'Payment update: invoice ')+x.number,`Dear ${P.name},\n\n${sale?`This is a gentle reminder that invoice ${x.number} dated ${x.date} for ${inr2(x.amount)} has ${inr2(o)} outstanding${x.due_date?', due on '+x.due_date:''}. Kindly arrange payment at the earliest.`:`We are processing payment against your invoice ${x.number} dated ${x.date}. Outstanding: ${inr2(o)}.`}\n\nRegards,\nShree Digitax Solutions`);
 $('#ed').onclick=()=>{if(sale){location.href='invoice-new.html?kind=sale&edit='+id;return}const ps=p.filter(y=>y.kind===(sale?'client':'supplier'));
  editBox('Edit '+(sale?'invoice':'bill'),[{n:'party_id',l:sale?'Customer':'Supplier',opts:ps.map(y=>[y.id,y.name]),full:1},{n:'number',l:'Number',req:1},{n:'date',l:'Date',t:'date',req:1},{n:'due_date',l:'Due date',t:'date'},{n:'taxable',l:'Taxable value (₹)',t:'number',step:'0.01',min:'0.01',req:1},{n:'gst_rate',l:'GST rate %',opts:RATES.map(String)},...(sale?[{n:'description',l:'Description of goods / services',full:1},{n:'hsn_sac',l:'HSN / SAC code'},{n:'quantity',l:'Quantity',t:'number',step:'any',min:0.001},{n:'unit',l:'Unit'},{n:'place_of_supply',l:'Place of supply',opts:GF.stateOpts(x.place_of_supply).map(o=>[o[0],o[0]?o[1]:'Same as customer state'])},{n:'reverse_charge',l:'Reverse charge',opts:[['false','No'],['true','Yes']]}]:[]),...(H.on?[{n:'gl_account_id',l:(sale?'Income head':'Expense head')+' (Chart of Accounts)',full:1,opts:[['',(sale?'Sales':'Purchases')+' (default)'],...H.heads.map(h=>[h.id,h.code+' '+h.label])]}]:[])],
  {...x,gl_account_id:x.gl_account_id||'',reverse_charge:String(!!x.reverse_charge),place_of_supply:x.place_of_supply?GF.canonState(x.place_of_supply):'',taxable:x.taxable==null?x.amount:x.taxable,gst_rate:x.taxable==null?(S.default_gst??18):x.gst_rate},
  async d=>{if(await lockedBlock(x.date,d.date))return false;const tv=+d.taxable,rt=+d.gst_rate,g=gst(tv,rt,S,ps.find(y=>y.id===d.party_id)),amount=rup(paise(tv)+paise(g.cgst)+paise(g.sgst)+paise(g.igst));
   if(+x.adjusted>0&&(paise(tv)!==paise(x.taxable)||rt!==+x.gst_rate)){alert('This document has credit/debit notes or TDS against it. Issue a further note instead of changing its value.');return false}
   if(paise(amount)<paise(x.paid)+paise(x.adjusted)){alert('The new total ('+inr2(amount)+') is less than the amount already '+(sale?'received':'paid')+' ('+inr2(x.paid)+'). Delete or reduce the payments first.');return false}
   const hs=String(d.hsn_sac||'').trim();if(sale&&hs&&!/^\d{4,8}$/.test(hs)){alert('HSN / SAC must be 4 to 8 digits.');return false}
   const nw=sale?{description:(d.description||'').trim()||null,hsn_sac:hs||null,quantity:+d.quantity>0?+d.quantity:null,unit:(d.unit||'').trim()||null,place_of_supply:d.place_of_supply||null,reverse_charge:d.reverse_charge==='true'}:{};
   const r=await GF.saveCompat(rw=>db.from('invoices').update(rw).eq('id',id),{party_id:d.party_id,number:d.number,date:d.date,due_date:d.due_date||null,taxable:tv,gst_rate:rt,...g,amount,...(H.on?{gl_account_id:d.gl_account_id||null}:{}),...nw},GF.INVOICE_NEW);
   if(r.error){alert(r.error.message);return false}if(r.dropped&&(r.lost||[]).length)alert('Saved, but the description / HSN / quantity details were not stored because migration 020 has not been run in Supabase yet.')}).then(()=>render(m))};
 $('#pr').onclick=()=>window.print();
 if($('#pdf')){const make=async b=>{const iss=TPPdf.invoiceChecks(S,P,x,items);if(iss.errors.length){alert(iss.errors.join('\n'));return null}
   if(iss.warnings.length&&!confirm('Please note before creating the PDF:\n\n• '+iss.warnings.join('\n• ')+'\n\nCreate the PDF anyway?'))return null;
   const old=b.textContent;b.disabled=true;b.textContent='Creating PDF...';try{return await TPPdf.invoice({S,P,x,items})}catch(e){alert('Could not create the PDF: '+e.message);return null}finally{b.disabled=false;b.textContent=old}};
  $('#pdf').onclick=async e=>{const r=await make(e.currentTarget);if(r){TPPdf.download(r);toast('PDF saved: '+r.filename)}};
  $('#shr').onclick=async e=>{const r=await make(e.currentTarget);if(!r)return;const t='Dear '+(P.name||'Sir/Madam')+',\n\nPlease find attached '+(S.gstin?'tax invoice ':'invoice ')+x.number+' dated '+TPPdf.dmy(x.date)+' for '+TPPdf.rs(x.amount)+(o>0.005?'. Amount due: '+TPPdf.rs(o)+(x.due_date?' (due '+TPPdf.dmy(x.due_date)+')':''):'')+'.\n\nRegards,\n'+(S.business_name||'Shree Digitax Solutions');const s=await TPPdf.share(r,t,TPPdf.waPhone(P.phone));if(s==='downloaded')toast('PDF saved. Attach it in WhatsApp or email.')}}
 if($('#itc'))$('#itc').onclick=async()=>{if(await lockedBlock(x.date))return;if(await ok(db.from('invoices').update({itc_blocked:!x.itc_blocked}).eq('id',id)))render(m)};
 if($('#gs'))$('#gs').onclick=async()=>{if(await fixGst([x],S,p))render(m)};
 $('#dl').onclick=async()=>{if(await lockedBlock(x.date,...pays.map(y=>y.date)))return;if(confirm('Delete this document? Recorded payments stay in Transactions.')&&await ok(db.from('invoices').delete().eq('id',id)))location.href='invoices.html?kind='+x.kind};
},'invoices.html?kind='+sk);
</script></body></html>
