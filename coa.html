<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toolkit Pro</title><link rel="preconnect" href="https://dpgkabvyappujokiujoh.supabase.co" crossorigin><link rel="stylesheet" href="assets/app.css?v=20261101"><script src="assets/vendor/supabase.js?v=20261101"></script><script src="assets/app.js?v=20261101"></script><script src="assets/reports-lib.js?v=20261101"></script></head><body><script>
boot('Chart of Accounts',async function render(m){
 const L=await loadLedger();if(ledgerGate(m,L))return;
 const tb=TP.trialBalance(L.accts,L.lines),bal=new Map(tb.rows.map(r=>[r.id,r])),T=[['asset','Assets'],['liability','Liabilities'],['equity','Equity'],['income','Income'],['expense','Expenses']];
 m.innerHTML=`<form id=f class="card noprint" style="display:flex;flex-wrap:wrap;gap:12px;align-items:end"><label>Code (3-6 digits)<input name=code inputmode=numeric pattern="[0-9]{3,6}" required placeholder="e.g. 5300"></label><label>Account name<input name=name required maxlength=80 placeholder="e.g. Travel expenses"></label><label>Type<select name=type>${T.map(([v,l])=>`<option value=${v}>${l}</option>`).join('')}</select></label><button>Add account</button><p id=err class=dn role=alert style="margin:0;width:100%"></p></form>
 ${T.map(([ty,lb])=>{const all=L.accts.filter(a=>a.type===ty),cmp=(a,b)=>String(a.code).localeCompare(String(b.code),undefined,{numeric:true}),ids=new Set(all.map(a=>a.id)),kids=new Map();
  for(const a of all)if(a.parent_id&&ids.has(a.parent_id)){if(!kids.has(a.parent_id))kids.set(a.parent_id,[]);kids.get(a.parent_id).push(a)}
  const nat=a=>{const r=bal.get(a.id),b=r?TP.rup(TP.paise(r.debit)-TP.paise(r.credit)):0;return TP.natural(a.type,b>0?b:0,b<0?-b:0)};
  const grp=a=>TP.rup((kids.get(a.id)||[]).reduce((s,k)=>s+TP.paise(grp(k)),TP.paise(nat(a))));
  const flat=[];const walk=(a,d)=>{flat.push([a,d]);(kids.get(a.id)||[]).sort(cmp).forEach(k=>walk(k,d+1))};
  all.filter(a=>!a.parent_id||!ids.has(a.parent_id)).sort(cmp).forEach(a=>walk(a,0));
  const canSub=a=>!a.bank_account_id&&a.system_key!=='receivables'&&a.system_key!=='payables';
  return`<div class=card><h3>${lb}</h3><table><caption class=sr>${lb} accounts</caption><thead><tr><th scope=col>Code<th scope=col>Name<th scope=col class=r>Balance<th scope=col class=noprint><span class=sr>Actions</span></tr></thead><tbody>${flat.map(([a,d])=>{const b=nat(a),has=kids.has(a.id);return`<tr><td>${esc(a.code)}<th scope=row style="padding-left:${12+d*22}px;font-weight:${has||!d?600:400}">${d?'↳ ':''}<a href="ledger.html?acc=${a.id}">${esc(a.name)}</a>${a.system_key||a.bank_account_id?' <span class=k>(built-in)</span>':''}${a.is_active?'':' <span class=k>(inactive)</span>'}</th><td class=r>${inr2(Math.abs(b))} ${TP.side(b,a.type)}${has?`<br><span class=k>with sub-accounts ${inr2(Math.abs(grp(a)))}</span>`:''}<td class=noprint>${canSub(a)?`<button class=g data-sub="${a.id}">Add sub-account</button> `:''}<button class=g data-ren="${a.id}">Rename</button> <button class=g data-act="${a.id}">${a.is_active?'Deactivate':'Activate'}</button></tr>`}).join('')||'<tr><td colspan=4>No accounts of this type yet.</tr>'}</tbody></table></div>`}).join('')}`;
 $('#f').onsubmit=e=>{e.preventDefault();const fm=$('#f');return guard(fm,async()=>{const d=Object.fromEntries(new FormData(fm)),r=await db.rpc('add_gl_account',{p_code:d.code.trim(),p_name:d.name,p_type:d.type});if(r.error){$('#err').textContent=r.error.message;return}toast('Account added');render(m)})};
 m.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{const pa=L.accts.find(x=>x.id===b.dataset.sub);
  editBox('Add sub-account under '+pa.name,[{n:'name',l:'Sub-account name (e.g. Software sales)',req:1,full:1},{n:'code',l:'Code (leave blank to pick the next free one)'}],{name:'',code:''},async d=>{
   const r=await db.rpc('add_gl_subledger',{p_name:d.name,p_parent:pa.id,p_code:(d.code||'').trim()||null});
   if(r.error){alert(noFn(r.error)?'Sub-accounts are not installed yet. Run 014_heads_subledgers.sql in the Supabase SQL Editor, then reload.':r.error.message);return false}return true}).then(()=>render(m))});
 m.querySelectorAll('[data-ren]').forEach(b=>b.onclick=()=>{const a=L.accts.find(x=>x.id===b.dataset.ren);editBox('Rename account',[{n:'name',l:'Account name',req:1,full:1}],a,d=>ok(db.from('gl_accounts').update({name:d.name.trim()}).eq('id',a.id))).then(()=>render(m))});
 m.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{const a=L.accts.find(x=>x.id===b.dataset.act);if(a.is_active&&!confirm('Deactivate '+a.name+'? It stays in reports but cannot be used in new manual journals.'))return;if(await ok(db.from('gl_accounts').update({is_active:!a.is_active}).eq('id',a.id)))render(m)});
},'coa.html');
</script></body></html>
