<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toolkit Pro</title><link rel="preconnect" href="https://dpgkabvyappujokiujoh.supabase.co" crossorigin><link rel="stylesheet" href="assets/app.css?v=20261030"><script src="assets/vendor/supabase.js?v=20261030"></script><script src="assets/app.js?v=20261030"></script><script src="assets/gst-fields.js?v=20261030"></script></head><body><script>
const kind=Q.get('kind')==='supplier'?'supplier':'client',sale=kind==='client'?'sale':'purchase',L=kind==='client'?'Customer':'Supplier';
const FLX=cur=>GF.partyFields(kind).map(f=>f.n==='state'?{...f,opts:GF.stateOpts(cur)}:f);
const PV=x=>({...x,state:GF.canonState(x.state),gst_type:x.gst_type||(x.gstin?'regular':'unregistered')});
const clean=d=>{d={...d};if(d.gstin)d.gstin=String(d.gstin).trim().toUpperCase();if(d.pan)d.pan=String(d.pan).trim().toUpperCase();if(d.pincode)d.pincode=String(d.pincode).trim();return d};
/* Checks that stop an unusable record; everything else is only advice. Returns true when the record may be saved. */
const vet=d=>{const t=d.gst_type||(d.gstin?'regular':'unregistered');if((t==='regular'||t==='composition'||t==='sez')&&!d.gstin){alert('A registered customer needs a GSTIN. Choose "Unregistered" if there is none.');return false}if(d.pan&&!GF.PAN_RE.test(d.pan)){alert('PAN must look like ABCDE1234F.');return false}if(d.pincode&&!GF.PIN_RE.test(d.pincode)){alert('PIN code must be 6 digits.');return false}if(d.gstin&&GF.stateCodeOf(d.gstin,'')&&d.state&&GF.stateCodeByName(d.state)&&GF.stateCodeOf(d.gstin,'')!==GF.stateCodeByName(d.state)&&!confirm('The GSTIN state code ('+d.gstin.slice(0,2)+') does not match the state selected. Save anyway?'))return false;return true};
const savedNote=r=>{if(r.dropped&&(r.lost||[]).length)alert('Saved, but the new fields ('+r.lost.join(', ')+') were not stored because migration 020 has not been run in Supabase yet. See supabase/migrations/020_invoice_pdf_fields.sql.')};
let q='';
boot(L+'s',async function render(m){
 const{p,i}=await load(),ps=p.filter(x=>x.kind===kind),iv=i.filter(x=>x.kind===sale);
 const ob=id=>iv.filter(y=>y.party_id===id).reduce((s,y)=>s+y.amount-y.paid-(+y.adjusted||0),0),tot=iv.reduce((s,y)=>s+y.amount-y.paid-(+y.adjusted||0),0),od=iv.filter(y=>stat(y)[1]==='od').reduce((s,y)=>s+y.amount-y.paid-(+y.adjusted||0),0);
 const card=(k,v,c='')=>`<div class=card><div class=k>${k}</div><div class="v ${c}">${v}</div></div>`;
 m.innerHTML=`<div class="row c4">${card(L+'s',ps.length)}${card('Outstanding',inr(tot))}${card('Overdue',inr(od),'dn')}<div class="card noprint"><button id=nw>+ New ${L}</button></div></div>
 <div class=card><input id=s placeholder="Search by name, email or GSTIN" value="${esc(q)}" style="width:100%;max-width:360px;margin-bottom:10px"><table><tr><th>Name<th>Contact<th>State<th>GSTIN<th class=r>Outstanding<th class=noprint></tr><tbody id=tb></tbody></table></div>
 <div class=modal id=md hidden><div class=card><h3>New ${L}</h3><form id=f class=g2>${FLX('').map(f=>`<label class="${f.full?'full':''}">${esc(f.l)}${f.opts?`<select name="${f.n}" ${f.n==='state'&&kind==='client'?'required':''}>${f.opts.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')}</select>`:`<input name="${f.n}" type="${f.t||'text'}" ${f.req||(f.n==='address'&&kind==='client')?'required':''}>`}</label>`).join('')}<div class="f2 full"><button>Save ${L}</button><button type=button class=g id=cx>Cancel</button></div></form></div></div>`;
 const draw=()=>{const k=q.toLowerCase();$('#tb').innerHTML=ps.filter(x=>(x.name+' '+(x.email||'')+' '+(x.gstin||'')).toLowerCase().includes(k)).map(x=>`<tr><td><a href="party.html?id=${x.id}&kind=${kind}">${esc(x.name)}</a><td>${esc(x.email||x.phone||'')}<td>${esc(x.state)}<td>${esc(x.gstin)}<td class=r>${inr(ob(x.id))}<td class=noprint><button class=g data-e="${x.id}">Edit</button></tr>`).join('')||'<tr><td colspan=6>No '+L.toLowerCase()+'s yet. Click New '+L+' to add one.</tr>';
  $('#tb').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>editBox('Edit '+L,FLX(ps.find(x=>x.id===b.dataset.e).state),PV(ps.find(x=>x.id===b.dataset.e)),async d=>{d=clean(d);if(!gstinGate(d.gstin)||!vet(d))return false;const r=await GF.saveCompat(row=>db.from('parties').update(row).eq('id',b.dataset.e),nul(d),GF.PARTY_NEW);if(r.error){alert(r.error.message);return false}savedNote(r)}).then(()=>render(m)))};draw();
 $('#s').oninput=e=>{q=e.target.value;draw()};$('#nw').onclick=()=>{$('#md').hidden=false};$('#cx').onclick=()=>{$('#md').hidden=true};
 $('#f').onsubmit=async e=>{e.preventDefault();let d=clean(Object.fromEntries([...new FormData($('#f'))].filter(x=>x[1]!=='')));if(!gstinGate(d.gstin)||!vet(d))return;const r=await GF.saveCompat(row=>db.from('parties').insert({...row,kind}),d,GF.PARTY_NEW);if(r.error){alert(r.error.message);return}savedNote(r);toast(L+' saved');render(m)};
},'customers.html?kind='+kind);
</script></body></html>
