<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toolkit Pro</title><link rel="preconnect" href="https://dpgkabvyappujokiujoh.supabase.co" crossorigin><link rel="stylesheet" href="assets/app.css?v=20261101"><script src="assets/vendor/supabase.js?v=20261101"></script><script src="assets/app.js?v=20261101"></script><script src="assets/reports-lib.js?v=20261101"></script></head><body><script>
const vd=s=>/^\d{4}-\d\d-\d\d$/.test(s||'')?s:null,fy0=TP.fyOf(today());let from=vd(Q.get('from'))||fy0.start,to=vd(Q.get('to'))||today();
boot('Financial Statements',async function render(m){
 const L=await loadLedger();if(ledgerGate(m,L))return;
 const bad=from>to,R=bad?null:TP.finStatements(L.accts,L.lines,from,to);
 const row=(k,a,b,cls)=>`<tr${cls?' class='+cls:''}><td>${k}<td class=r>${a==null?'':inr2(a)}<td class=r>${b==null?'':inr2(b)}</tr>`;
 const grp=(g,gp)=>g.rows.length||g.total?row('<b>'+esc(g.title)+'</b>',g.total,gp&&gp.total)+g.rows.map(r=>row('&nbsp;&nbsp;'+esc(r.label),r.amount)).join(''):'';
 const sec=(t)=>`<tr><th scope=colgroup colspan=3>${t}</th></tr>`;
 let body='';
 if(R){const b=R.balanceSheet,q=R.balanceSheetPrior,e=b.equityAndLiabilities,eq=q.equityAndLiabilities,p=R.profitAndLoss,pp=R.profitAndLossPrior,c=R.cashFlow,pl=(k,lab)=>row(lab,p[k].total,pp[k].total);
  body=`<div class=card id=sch-bs><h3>Balance Sheet as at ${b.asOf}</h3><p class=k>Comparative column: ${q.asOf}.</p><table><thead><tr><th scope=col><th scope=col class=r>${b.asOf}<th scope=col class=r>${q.asOf}</tr></thead><tbody>
  ${sec('ASSETS')}${sec('Non-current assets')}${b.assets.nonCurrent.map((g,k)=>grp(g,q.assets.nonCurrent[k])).join('')}${row('<b>Total non-current assets</b>',b.assets.totalNonCurrent,q.assets.totalNonCurrent)}
  ${sec('Current assets')}${b.assets.current.map((g,k)=>grp(g,q.assets.current[k])).join('')}${row('<b>Total current assets</b>',b.assets.totalCurrent,q.assets.totalCurrent)}
  ${row('<b>TOTAL ASSETS</b>',b.assets.total,q.assets.total,'tot')}
  ${sec('EQUITY AND LIABILITIES')}${sec("Owner's funds / equity")}${e.equity.rows.map(r=>row('&nbsp;&nbsp;'+esc(r.label),r.amount)).join('')}${row('&nbsp;&nbsp;Retained earnings (earlier years)',e.equity.retainedEarlier,eq.equity.retainedEarlier)}${row('&nbsp;&nbsp;Profit / (loss) for the year',e.equity.profitForYear,eq.equity.profitForYear)}${row('<b>Total equity</b>',e.equity.total,eq.equity.total)}
  ${sec('Non-current liabilities')}${e.nonCurrentLiabilities.rows.map(r=>row('&nbsp;&nbsp;'+esc(r.label),r.amount)).join('')}${row('<b>Total non-current liabilities</b>',e.nonCurrentLiabilities.total,eq.nonCurrentLiabilities.total)}
  ${sec('Current liabilities')}${e.currentLiabilities.map((g,k)=>grp(g,eq.currentLiabilities[k])).join('')}${row('<b>Total current liabilities</b>',e.totalCurrent,eq.totalCurrent)}
  ${row('<b>TOTAL EQUITY AND LIABILITIES</b>',e.total,eq.total,'tot')}</tbody></table>
  <p role=${b.balanced?'status':'alert'} class=${b.balanced?'up':'dn'}>${b.balanced?'Balance sheet balances.':'Does NOT balance: difference '+inr2(b.difference)+'. Check the Trial Balance.'}</p></div>
  <div class=card id=sch-pl><h3>Statement of Profit and Loss, ${from} to ${to}</h3><p class=k>Comparative column: the same length of period one year earlier (${pp.from} to ${pp.to}). No income-tax expense or deferred tax is booked in this ledger; profit shown is before tax.</p><table><thead><tr><th scope=col><th scope=col class=r>Current<th scope=col class=r>Comparative</tr></thead><tbody>
  ${pl('revenue','Revenue from operations (Sales)')}${pl('otherIncome','Other income')}${row('<b>Total income</b>',p.totalIncome,pp.totalIncome)}
  ${pl('materials','Cost of goods: purchases')}${pl('inventoryChange','Changes in inventories (stock)')}${pl('depreciation','Depreciation')}${pl('otherExpenses','Other expenses')}${row('<b>Total expenses</b>',p.totalExpenses,pp.totalExpenses)}
  ${row('<b>Profit / (loss) before tax</b>',p.profitBeforeTax,pp.profitBeforeTax,'tot')}</tbody></table></div>
  <div class=card id=sch-cf><h3>Cash Flow Statement (indirect method), ${from} to ${to}</h3><table><tbody>
  ${row('Profit / (loss) before tax',c.profitBeforeTax)}${row('Add: depreciation',c.depreciationAddBack)}${row('Changes in working capital (stock, debtors, other current assets, creditors, other current liabilities)',c.workingCapital)}${row('<b>Net cash from operating activities</b>',c.operating)}
  ${row('<b>Net cash from investing activities</b> (purchase of fixed assets and other non-current assets)',c.investing)}
  ${row('<b>Net cash from financing activities</b> (capital, drawings, opening balances, loans)',c.financing)}
  ${row('<b>Net increase / (decrease) in cash and bank</b>',c.netChange,null,'tot')}${row('Cash and bank at start',c.openingCash)}${row('Cash and bank at end',c.closingCash)}</tbody></table>
  <p role=${c.agrees?'status':'alert'} class=${c.agrees?'up':'dn'}>${c.agrees?'Agrees with the change in cash and bank balances in the ledger.':'Does NOT agree with the ledger cash balances: difference '+inr2(c.difference)+'.'}</p></div>
  <div class="card k"><b>Basis of preparation.</b> Derived from the posted ledger on the accrual basis. Grouping is by account type and code range (fixed assets 1500-1599, other non-current assets 1600+, non-current liabilities 2500+); it is a presentation aid and not a statutory format. Notes to accounts, accounting policies, related-party disclosures, deferred tax, provisions, expected credit losses and Ind AS/AS-specific disclosures are not generated. Have your CA review before use.</div>`}
 m.innerHTML=`<form id=f class="card noprint" style="display:flex;flex-wrap:wrap;gap:12px;align-items:end"><label>From<input type=date name=a value="${esc(from)}" required></label><label>To<input type=date name=b value="${esc(to)}" required></label><button>Show</button><button type=button class=g id=fy>This financial year</button><button type=button class=g id=pr>Print</button><button type=button class=g id=csv>Export CSV</button></form>${bad?'<div class=card role=alert>The From date is after the To date.</div>':body}`;
 $('#f').onsubmit=e=>{e.preventDefault();const d=new FormData($('#f'));from=d.get('a')||from;to=d.get('b')||to;render(m)};
 $('#fy').onclick=()=>{from=fy0.start;to=today();render(m)};$('#pr').onclick=()=>window.print();
 $('#csv').onclick=()=>{if(!R)return;const b=R.balanceSheet,e=b.equityAndLiabilities,p=R.profitAndLoss,c=R.cashFlow,rows=[['Statement','Line','Amount'],
  ...b.assets.nonCurrent.map(g=>['Balance sheet '+b.asOf,g.title,g.total]),['Balance sheet '+b.asOf,'Total non-current assets',b.assets.totalNonCurrent],...b.assets.current.map(g=>['Balance sheet '+b.asOf,g.title,g.total]),['Balance sheet '+b.asOf,'Total assets',b.assets.total],
  ['Balance sheet '+b.asOf,'Equity (incl. profit)',e.equity.total],['Balance sheet '+b.asOf,'Non-current liabilities',e.nonCurrentLiabilities.total],...e.currentLiabilities.map(g=>['Balance sheet '+b.asOf,g.title,g.total]),['Balance sheet '+b.asOf,'Total equity and liabilities',e.total],
  ['Profit and loss','Revenue from operations',p.revenue.total],['Profit and loss','Other income',p.otherIncome.total],['Profit and loss','Purchases',p.materials.total],['Profit and loss','Changes in inventories',p.inventoryChange.total],['Profit and loss','Depreciation',p.depreciation.total],['Profit and loss','Other expenses',p.otherExpenses.total],['Profit and loss','Profit before tax',p.profitBeforeTax],
  ['Cash flow','Operating',c.operating],['Cash flow','Investing',c.investing],['Cash flow','Financing',c.financing],['Cash flow','Net change',c.netChange],['Cash flow','Opening cash',c.openingCash],['Cash flow','Closing cash',c.closingCash]];
  TP.download('financial-statements-'+from+'-to-'+to+'.csv',rows)};
},'statements.html');
</script></body></html>
