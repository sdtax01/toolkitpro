<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toolkit Pro</title><link rel="preconnect" href="https://dpgkabvyappujokiujoh.supabase.co" crossorigin><link rel="stylesheet" href="assets/app.css?v=20261028"><script src="assets/vendor/supabase.js?v=20261028"></script><script src="assets/app.js?v=20261028"></script><script src="assets/reports-lib.js?v=20261028"></script></head><body><script>
boot('Ledger Setup',async function render(m){
 const L=await loadLedger();
 if(L.missing){ledgerGate(m,L);return}
 if(!L.ready){
  m.innerHTML=`<form id=f class=card><h3>Switch on your books</h3>
   <p>This builds a proper double-entry ledger from the invoices, payments, transactions and bank balances you already have. <b>Your existing data and screens are not changed.</b> From then on every new invoice, bill, payment and transaction also posts balanced journal entries automatically, and editing or deleting one posts a reversal instead of rewriting history.</p>
   <ul><li>Debtors, creditors, GST (output and input), sales, purchases, bank and cash accounts are created for you.</li><li>Each expense/income category becomes its own ledger account.</li><li>Bank opening balances become opening entries against <i>Opening balance equity</i>.</li><li>You can undo the whole ledger with <code>supabase/undo/012_ledger_down.sql</code>; your invoices and transactions stay.</li></ul>
   <label style="max-width:320px">Books start from (opening balance date)<input type=date name=d value="${TP.fyStart(today())}" required></label>
   <p class=k>If any invoice or transaction is dated earlier, the opening date moves back to the earliest one so nothing is missed.</p>
   <p id=err class=dn role=alert></p><button id=go>Set up ledger</button></form>`;
  $('#f').onsubmit=e=>{e.preventDefault();const fm=$('#f');return guard(fm,async()=>{if(!confirm('Switch on the ledger now? It posts journals for all existing records. This can be undone with the undo script.'))return;
   const r=await db.rpc('setup_ledger',{p_opening_date:new FormData(fm).get('d')});if(r.error){$('#err').textContent=r.error.message;return}
   toast('Ledger is ready: '+(r.data?.posted??0)+' entries posted');render(m)})};
  return}
 const{i,t,a}=await load(),S=L.settings,tb=TP.trialBalance(L.accts,L.lines);
 const[un,er,lk]=await Promise.all([db.rpc('ledger_unsynced'),db.from('ledger_errors').select('*').order('at',{ascending:false}).limit(10),db.from('ledger_lock_history').select('*').order('changed_at',{ascending:false}).limit(5)]);
 const rc=TP.reconcile({lines:L.lines,accts:L.accts,invoices:i,txns:t,bankAccounts:a}),unsynced=un.error?[]:un.data||[],pm=new Map((await load()).p.map(p=>[p.id,p.name]));
 m.innerHTML=`<div class="row c4 rep"><div class=card><div class=k>Books start</div><div class=v style="font-size:18px">${esc(S.opening_date||'')}</div></div><div class=card><div class=k>Journals</div><div class=v>${L.journals.length}</div></div><div class=card><div class=k>Trial balance</div><div class="v ${tb.balanced?'up':'dn'}" style="font-size:18px">${tb.balanced?'Balanced':'Out by '+inr2(tb.difference)}</div></div><div class=card><div class=k>Locked through</div><div class=v style="font-size:18px">${esc(S.locked_through||'Not locked')}</div></div></div>
 <div class=card id=prefs><h3>Period lock</h3><p class=k>Locking a date stops any new, edited or deleted entry dated on or before it, so closed periods (for example a filed GST month) cannot change. Unlocking is recorded.</p>
  <form id=lf style="display:flex;flex-wrap:wrap;gap:12px;align-items:end"><label>Lock all entries up to and including<input type=date name=d value="${esc(S.locked_through||'')}" max="${today()}"></label><button>Lock period</button><button type=button class=g id=unl ${S.locked_through?'':'disabled'}>Unlock</button></form>
  ${(lk.data||[]).length?`<p class=k style="margin-bottom:0">Recent changes: ${(lk.data||[]).map(x=>esc(String(x.changed_at).slice(0,16).replace('T',' '))+' → '+esc(x.locked_through||'unlocked')).join('; ')}</p>`:''}</div>
 <div class=card><h3>Safety switches</h3><p class=k>Optional, off by default. <b>Strict posting</b>: if the ledger cannot post an entry, the invoice or payment is not saved either (no silent drift). <b>Protect documents</b>: sales invoices cannot be deleted (issue a credit note) and nothing with recorded payments can be deleted. Needs migration 015.</p>${S.strict_posting===undefined?'<p class=k>Migration 015 is not installed.</p>':`<label style="display:block"><input type=checkbox id=sp style="width:auto" ${S.strict_posting?'checked':''}> Strict posting</label><label style="display:block"><input type=checkbox id=pd style="width:auto" ${S.protect_documents?'checked':''}> Protect documents</label>`}</div>
 <div class=card><h3>Reconciliation: ledger vs your records</h3><p class=k>Every line should show a zero difference. A difference means something needs review (see the notes below the table).</p>
  <table><caption class=sr>Reconciliation</caption><thead><tr><th scope=col>Check<th scope=col class=r>Ledger<th scope=col class=r>Your records<th scope=col class=r>Difference<th scope=col>Status</tr></thead><tbody>${rc.checks.map(c=>`<tr><th scope=row>${esc(c.name)}</th><td class=r>${inr2(c.ledger)}<td class=r>${inr2(c.books)}<td class=r>${inr2(c.diff)}<td>${c.ok?'<span class="bd ok">OK</span>':'<span class="bd od">Review</span>'}</tr>`).join('')}<tr><th scope=row>Trial balance debit = credit</th><td class=r colspan=3><td>${rc.trialBalanceBalanced?'<span class="bd ok">OK</span>':'<span class="bd od">Review</span>'}</tr></tbody></table>
  ${rc.partyDifferences.length?`<h3 style="margin-top:14px">Customers/suppliers that differ</h3><table><thead><tr><th scope=col>Name<th scope=col class=r>Ledger<th scope=col class=r>Invoices<th scope=col class=r>Difference</tr></thead><tbody>${rc.partyDifferences.map(d=>`<tr><th scope=row>${esc(pm.get(d.party_id)||'(deleted contact)')} <span class=k>(${d.kind==='sale'?'customer':'supplier'})</span></th><td class=r>${inr2(d.ledger)}<td class=r>${inr2(d.books)}<td class=r>${inr2(d.diff)}</tr>`).join('')}</tbody></table><p class=k>Usually a payment whose linked invoice differs from the invoice's recorded paid amount, or a manual change. Open the party Statement for the "Data check" notice.</p>`:''}</div>
 <div class=card><h3>Sync check</h3>${unsynced.length?`<p class=dn role=alert>${unsynced.length} record(s) are not in step with the ledger.</p><table><thead><tr><th scope=col>Record<th scope=col>Reason</tr></thead><tbody>${unsynced.slice(0,15).map(u=>`<tr><td>${esc(u.source_table)} ${esc(String(u.source_id).slice(0,8))}<td>${esc(u.reason)}</tr>`).join('')}</tbody></table>`:'<p class=up>Every invoice, payment, transaction and bank opening balance is posted correctly.</p>'}
  ${(er.data||[]).length?`<h3 style="margin-top:12px">Recent posting problems</h3><ul class=k>${er.data.map(x=>`<li>${esc(String(x.at).slice(0,16).replace('T',' '))}: ${esc(x.source_table)} — ${esc(x.message)}</li>`).join('')}</ul>`:''}
  <button id=rs class=g>Re-sync now</button> <span class=k>Posts anything missing or out of date. Safe to repeat.</span></div>`;
 $('#lf').onsubmit=e=>{e.preventDefault();const fm=$('#lf');return guard(fm,async()=>{const d=new FormData(fm).get('d');if(!d)return alert('Choose a date to lock through.');
  if(!confirm('Lock every entry up to and including '+d+'? Nothing dated on or before it can then be added, edited or deleted until you unlock.'))return;
  const r=await db.rpc('set_period_lock',{p_date:d});if(r.error)return alert(r.error.message);toast('Period locked through '+d);render(m)})};
 $('#unl').onclick=async()=>{if(!confirm('Unlock all periods? Entries in earlier dates can be changed again.'))return;const r=await db.rpc('set_period_lock',{p_date:null});if(r.error)return alert(r.error.message);toast('Unlocked');render(m)};
 ['sp','pd'].forEach(k=>{if($('#'+k))$('#'+k).onchange=async()=>{const r=await db.rpc('set_ledger_controls',{p_strict:$('#sp').checked,p_protect:$('#pd').checked});if(r.error){alert(r.error.message);return render(m)}toast('Saved')}});
 $('#rs').onclick=async e=>{const b=e.currentTarget;b.disabled=true;const r=await db.rpc('resync_ledger',{p_strict:false});b.disabled=false;if(r.error)return alert(r.error.message);
  const errs=(r.data&&r.data.errors)||[];toast('Re-sync done: '+(r.data?.posted||0)+' posted'+(errs.length?', '+errs.length+' could not be posted':''));if(errs.length)alert('Could not post:\n'+errs.slice(0,10).map(x=>x.label+': '+x.message).join('\n'));render(m)};
},'ledger-setup.html');
</script></body></html>
