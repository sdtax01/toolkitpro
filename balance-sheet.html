<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toolkit Pro</title><link rel="preconnect" href="https://dpgkabvyappujokiujoh.supabase.co" crossorigin><link rel="stylesheet" href="assets/app.css?v=20261031"><script src="assets/vendor/supabase.js?v=20261031"></script><script src="assets/app.js?v=20261031"></script><script src="assets/reports-lib.js?v=20261031"></script></head><body><script>
const vd=s=>/^\d{4}-\d\d-\d\d$/.test(s||'')?s:null;let asOf=vd(Q.get('asof'))||today();
boot('Balance Sheet',async function render(m){
 const L=await loadLedger();if(ledgerGate(m,L))return;
 const b=TP.balanceSheet(L.accts,L.lines,asOf),sec=(t,rows,extra,tot)=>`<tr><th scope=colgroup colspan=2>${t}</th></tr>${rows.map(r=>`<tr><td><a href="ledger.html?acc=${r.id}&to=${asOf}">${esc(r.label||r.name)}</a><td class=r>${inr2(r.amount)}</tr>`).join('')}${extra||''}${!rows.length&&!extra?'<tr><td colspan=2 class=k>None</tr>':''}<tr><td><b>Total ${t.toLowerCase()}</b><td class=r><b>${inr2(tot)}</b></tr>`;
 const eqx=(b.priorProfit?`<tr><td>Retained earnings (earlier years)<td class=r>${inr2(b.priorProfit)}</tr>`:'')+`<tr><td>Profit for FY ${b.fy} so far<td class=r>${inr2(b.currentProfit)}</tr>`;
 m.innerHTML=`<form id=f class="card noprint" style="display:flex;flex-wrap:wrap;gap:12px;align-items:end"><label>As on<input type=date name=d value="${esc(asOf)}" required></label><button>Show</button><button type=button class=g id=pr>Print</button><button type=button class=g id=csv>Export CSV</button></form>
 <div class=card role=${b.balanced?'status':'alert'} style="border-left:4px solid ${b.balanced?'#16a34a':'#dc2626'}"><b>${b.balanced?'Balance sheet balances':'Balance sheet does NOT balance'}</b>: assets ${inr2(b.totalAssets)}, liabilities + equity ${inr2(b.totalLiabEquity)}${b.balanced?'':', difference '+inr2(b.difference)+'. Check the Trial Balance.'}</div>
 <div class="row c2"><div class=card><table><caption class=sr>Assets as on ${asOf}</caption><tbody>${sec('Assets',b.assets,'',b.totalAssets)}</tbody></table></div>
 <div class=card><table><caption class=sr>Liabilities and equity as on ${asOf}</caption><tbody>${sec('Liabilities',b.liabilities,'',b.totalLiabilities)}${sec('Equity',b.equity,eqx,b.totalEquity)}</tbody><tfoot><tr><th scope=row>Total liabilities + equity</th><td class=r><b>${inr2(b.totalLiabEquity)}</b></tr></tfoot></table></div></div>`;
 $('#f').onsubmit=e=>{e.preventDefault();asOf=new FormData($('#f')).get('d')||today();render(m)};$('#pr').onclick=()=>window.print();
 $('#csv').onclick=()=>TP.download('balance-sheet-'+asOf+'.csv',[['Section','Account','Amount'],...b.assets.map(r=>['Assets',r.name,r.amount]),['Assets','Total assets',b.totalAssets],...b.liabilities.map(r=>['Liabilities',r.name,r.amount]),...b.equity.map(r=>['Equity',r.name,r.amount]),['Equity','Retained earnings (earlier years)',b.priorProfit],['Equity','Profit for current year',b.currentProfit],['','Total liabilities + equity',b.totalLiabEquity]]);
},'balance-sheet.html');
</script></body></html>
