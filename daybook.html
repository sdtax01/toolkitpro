<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toolkit Pro</title><link rel="preconnect" href="https://dpgkabvyappujokiujoh.supabase.co" crossorigin><link rel="stylesheet" href="assets/app.css?v=20261024"><script src="assets/vendor/supabase.js?v=20261024"></script><script src="assets/app.js?v=20261024"></script><script src="assets/reports-lib.js?v=20261024"></script></head><body><script>
let from=Q.get('from')??TP.fyStart(today()),to=Q.get('to')??today(),kind='all';
boot('Day Book',async function render(m){
 const L=await loadLedger();if(ledgerGate(m,L))return;const{i}=await load();
 const book=TP.dayBook(L.journals,L.lines,L.accts,from||null,to||null).filter(j=>kind==='all'||j.kind===kind),rev=new Set(L.journals.filter(j=>j.reverses).map(j=>j.reverses)),KL={auto:'Automatic',manual:'Manual',reversal:'Reversal',opening:'Opening'};
 m.innerHTML=`<form id=f class="card noprint" style="display:flex;flex-wrap:wrap;gap:12px;align-items:end"><label>From<input type=date name=from value="${esc(from)}"></label><label>To<input type=date name=to value="${esc(to)}"></label><label>Type<select name=kind>${[['all','All'],['auto','Automatic (invoices, payments)'],['manual','Manual journals'],['reversal','Reversals'],['opening','Opening balances']].map(([v,l])=>`<option value="${v}" ${v===kind?'selected':''}>${l}</option>`).join('')}</select></label><button>Apply</button><button type=button class=g id=all>All dates</button><button type=button class=g id=csv>Export CSV</button><button type=button class=g id=pr>Print</button><a class=btn href="journal-new.html">+ Manual journal</a></form>
 <div class=card><p class=k>${book.length} journal(s). Posted entries cannot be edited or deleted; a manual journal can be reversed, and invoices/payments are corrected by editing the invoice or payment itself.</p>
 ${book.map(j=>{const u=jsrc(j.source_table,j.source_id,i),r=rev.has(j.id);return`<div class=card style="box-shadow:none;border:1px solid #e4e8f2;margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${j.label} · ${j.entry_date} · <span class=k>${KL[j.kind]}</span>${r?' · <span class=dn>reversed</span>':''}</b><span class=noprint>${u?`<a href="${u}">Open source</a> `:''}${j.kind==='manual'&&!r?`<button class=x data-rev="${j.id}">Reverse</button>`:''}</span></div><div class=k>${esc(j.narration)}${j.reason?' — reason: '+esc(j.reason):''}</div>
  <table><caption class=sr>${j.label} lines</caption><thead><tr><th scope=col>Account<th scope=col class=r>Debit<th scope=col class=r>Credit</tr></thead><tbody>${j.lines.map(l=>`<tr><td>${esc(l.code+' '+l.name)}${l.memo?` <span class=k>(${esc(l.memo)})</span>`:''}<td class=r>${l.debit?inr2(l.debit):''}<td class=r>${l.credit?inr2(l.credit):''}</tr>`).join('')}</tbody></table></div>`}).join('')||'<p>No journals in this period.</p>'}</div>`;
 $('#f').onsubmit=e=>{e.preventDefault();const d=new FormData($('#f'));from=d.get('from')||'';to=d.get('to')||'';kind=d.get('kind');if(from&&to&&from>to)return alert('"From" date must be on or before "To" date.');render(m)};
 $('#all').onclick=()=>{from='';to='';render(m)};$('#pr').onclick=()=>window.print();
 $('#csv').onclick=()=>TP.download('day-book-'+(to||today())+'.csv',[['Journal','Date','Type','Narration','Account code','Account','Debit','Credit'],...book.flatMap(j=>j.lines.map(l=>[j.label,j.entry_date,KL[j.kind],j.narration,l.code,l.name,l.debit||'',l.credit||'']))]);
 m.querySelectorAll('[data-rev]').forEach(b=>b.onclick=async()=>{const why=prompt('Reason for reversing this journal (required):');if(why===null)return;if(why.trim().length<3)return alert('Please give a reason.');
  const d=prompt('Date for the reversal entry (YYYY-MM-DD)',today());if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(d))return alert('Enter the date as YYYY-MM-DD.');
  b.disabled=true;const r=await db.rpc('reverse_journal',{p_journal:b.dataset.rev,p_reason:why.trim(),p_date:d});b.disabled=false;if(r.error)return alert(r.error.message);toast('Journal reversed');render(m)});
},'daybook.html');
</script></body></html>
