<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toolkit Pro</title><link rel="preconnect" href="https://dpgkabvyappujokiujoh.supabase.co" crossorigin><link rel="stylesheet" href="assets/app.css?v=20261028"><script src="assets/vendor/supabase.js?v=20261028"></script><script src="assets/app.js?v=20261028"></script><script src="assets/reports-lib.js?v=20261028"></script></head><body><script>
const fy0=TP.fyOf(today());const vd=s=>/^\d{4}-\d\d-\d\d$/.test(s||'')?s:null;let from=vd(Q.get('from'))||fy0.start,to=vd(Q.get('to'))||today();
boot('Profit & Loss',async function render(m){
 const L=await loadLedger();if(ledgerGate(m,L))return;
 const bad=from>to,p=bad?null:TP.profitAndLoss(L.accts,L.lines,from,to),sec=(t,rows,tot)=>`<tr><th scope=colgroup colspan=3>${t}</th></tr>${rows.map(r=>`<tr><td>${esc(r.code)}<td><a href="ledger.html?acc=${r.id}&from=${from}&to=${to}">${esc(r.label||r.name)}</a><td class=r>${inr2(r.amount)}</tr>`).join('')||'<tr><td colspan=3 class=k>None in this period</tr>'}<tr><td><td><b>Total ${t.toLowerCase()}</b><td class=r><b>${inr2(tot)}</b></tr>`;
 m.innerHTML=`<form id=f class="card noprint" style="display:flex;flex-wrap:wrap;gap:12px;align-items:end"><label>From<input type=date name=a value="${esc(from)}" required></label><label>To<input type=date name=b value="${esc(to)}" required></label><button>Show</button><button type=button class=g id=fy>This financial year</button><button type=button class=g id=pr>Print</button><button type=button class=g id=csv>Export CSV</button></form>
 ${bad?'<div class=card role=alert>The From date is after the To date.</div>':`<div class="row c4"><div class=card><div class=k>Income</div><div class=v>${inr2(p.totalIncome)}</div></div><div class=card><div class=k>Expenses</div><div class=v>${inr2(p.totalExpense)}</div></div><div class=card><div class=k>Net ${p.isLoss?'loss':'profit'}</div><div class="v ${p.isLoss?'dn':'up'}">${inr2(Math.abs(p.netProfit))}</div></div></div>
 <div class=card><table><caption class=sr>Profit and loss ${from} to ${to}</caption><tbody>${sec('Income',p.income,p.totalIncome)}${sec('Expenses',p.expenses,p.totalExpense)}</tbody><tfoot><tr><th scope=row colspan=2>Net ${p.isLoss?'loss':'profit'}</th><td class=r><b>${inr2(Math.abs(p.netProfit))}</b></tr></tfoot></table><p class=k>Prepared from posted journal entries (accrual basis: invoices count when raised, not when paid).</p></div>`}`;
 $('#f').onsubmit=e=>{e.preventDefault();const d=new FormData($('#f'));from=d.get('a')||from;to=d.get('b')||to;render(m)};
 $('#fy').onclick=()=>{from=fy0.start;to=today();render(m)};$('#pr').onclick=()=>window.print();
 $('#csv').onclick=()=>{if(!p)return;TP.download('profit-loss-'+from+'-to-'+to+'.csv',[['Section','Code','Account','Amount'],...p.income.map(r=>['Income',r.code,r.name,r.amount]),['Income','','Total income',p.totalIncome],...p.expenses.map(r=>['Expense',r.code,r.name,r.amount]),['Expense','','Total expenses',p.totalExpense],['','','Net '+(p.isLoss?'loss':'profit'),p.netProfit]])};
},'profit-loss.html');
</script></body></html>
