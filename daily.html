<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toolkit Pro</title><link rel="preconnect" href="https://dpgkabvyappujokiujoh.supabase.co" crossorigin><link rel="stylesheet" href="assets/app.css?v=20261030"><script src="assets/vendor/supabase.js?v=20261030"></script><script src="assets/app.js?v=20261030"></script><script src="assets/reports-lib.js?v=20261030"></script></head><body><script>
let day=Q.get('d')||today();
boot('Daily Summary',async function render(m){
 const{t,a,i,p,r,S}=await load(),D=TP.daily(day,t,a,i,p,r),card=(k,v,c,sub)=>`<div class=card><div class=k>${k}</div><div class="v ${c||''}">${inr2(v)}</div>${sub?`<div class=k>${sub}</div>`:''}</div>`;
 m.innerHTML=`<form id=df class="card noprint" style="display:flex;flex-wrap:wrap;gap:12px;align-items:end"><label>Date<input type=date name=d value="${esc(day)}" max="${today()}" required></label><button>Show</button><button type=button class=g id=td>Today</button><button type=button class=g id=pr>Print</button><button type=button class=g id=csv>Export CSV</button></form>
 <div class="row c4 rep">${card('Income on '+day,D.income,'up')}${card('Expenses on '+day,D.expense,'dn')}${card('Net for the day',D.net,D.net<0?'dn':'up')}${card('Cash and bank balance',D.cash,'','as of end of '+day)}</div>
 <div class="row c4 rep">${card('Income, month to date',D.mtdIncome,'up')}${card('Expenses, month to date',D.mtdExpense,'dn')}${card('Net, month to date',D.mtdNet,D.mtdNet<0?'dn':'up')}${card('Overdue to collect',D.receivables.overdue,D.receivables.overdue>0?'dn':'',D.receivables.overdueCount+' invoice(s)')}</div>
 <div class="row c21"><div class=card><h3>Collections and payments</h3><table><thead><tr><th scope=col><th scope=col class=r>Overdue<th scope=col class=r>Due in next 7 days</tr></thead><tbody>
  <tr><th scope=row>Receivables (customers)<td class=r>${inr2(D.receivables.overdue)} <span class=k>(${D.receivables.overdueCount})</span><td class=r>${inr2(D.receivables.soon)} <span class=k>(${D.receivables.soonCount})</span></tr>
  <tr><th scope=row>Payables (suppliers)<td class=r>${inr2(D.payables.overdue)} <span class=k>(${D.payables.overdueCount})</span><td class=r>${inr2(D.payables.soon)} <span class=k>(${D.payables.soonCount})</span></tr></tbody></table>
  <h3 style="margin-top:14px">Top overdue customers</h3><table><tbody>${D.topDebtors.map(y=>`<tr><th scope=row><a href="statement.html?id=${y.id}&kind=client">${esc(y.name)}</a><td class="r dn">${inr2(y.overdue)}<td class=r>${y.oldest} days</tr>`).join('')||'<tr><td colspan=3>No overdue customers.</tr>'}</tbody></table>
  <p class=noprint><a href="ageing.html?kind=sale">Full debtors ageing</a> · <a href="ageing.html?kind=purchase">Creditors ageing</a></p></div>
 <div class=card><h3>Bank and cash accounts</h3><table><tbody>${D.accounts.map(y=>`<tr><th scope=row>${esc(y.name)}<td class=r>${inr2(y.balance)}</tr>`).join('')||'<tr><td colspan=2>No accounts yet. Add one under Banking.</tr>'}${D.unassigned?`<tr><th scope=row>No account selected<td class=r>${inr2(D.unassigned)}</tr>`:''}</tbody></table>
  <h3 style="margin-top:14px">Reminders (next 7 days)</h3><ul class=k style="padding-left:18px;margin:0">${D.reminders.map(y=>`<li>${esc(y.title)}, <span class="${y.due_date<day?'dn':''}">${y.due_date<day?'overdue since ':'due '}${y.due_date}</span></li>`).join('')||'<li>Nothing pending.</li>'}</ul></div></div>
 <div class=card><h3>Entries on ${day}</h3><table><thead><tr><th scope=col>Description<th scope=col>Category<th scope=col>Type<th scope=col class=r>Amount</tr></thead><tbody>${D.entries.map(y=>`<tr><td>${esc(y.description)}<td>${esc(y.category)}<td>${y.type}<td class="r ${y.type==='income'?'up':'dn'}">${y.type==='income'?'':'-'}${inr2(y.amount)}</tr>`).join('')||'<tr><td colspan=4>No entries on this date.</tr>'}</tbody></table></div>`;
 $('#df').onsubmit=e=>{e.preventDefault();const v=new FormData($('#df')).get('d');if(!v)return;day=v>today()?today():v;render(m)};
 $('#td').onclick=()=>{day=today();render(m)};$('#pr').onclick=()=>window.print();
 $('#csv').onclick=()=>TP.download('daily-summary-'+day+'.csv',[['Daily summary',day],['Income',D.income],['Expenses',D.expense],['Net',D.net],['Cash and bank balance',D.cash],['Overdue receivables',D.receivables.overdue],['Overdue payables',D.payables.overdue],[],['Description','Category','Type','Amount'],...D.entries.map(y=>[y.description,y.category||'',y.type,y.amount])]);
},'daily.html');
</script></body></html>
