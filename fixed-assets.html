<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toolkit Pro</title><link rel="preconnect" href="https://dpgkabvyappujokiujoh.supabase.co" crossorigin><link rel="stylesheet" href="assets/app.css?v=20261027"><script src="assets/vendor/supabase.js?v=20261027"></script><script src="assets/app.js?v=20261027"></script><script src="assets/reports-lib.js?v=20261027"></script></head><body><script>
const need=(m,n,what)=>{m.innerHTML=`<div class=card role=status><h3>${what} not installed yet</h3><p>Run <b>${n}</b> from the <code>supabase/migrations</code> folder in the Supabase SQL Editor (after the earlier migrations), then reload. Everything else keeps working without it.</p></div>`};
let fyp=null;
boot('Fixed Assets',async function render(m){
 const L=await loadLedger();if(ledgerGate(m,L))return;
 const[aq,dq]=await Promise.all([db.from('fixed_assets').select('*').order('put_to_use'),db.from('fixed_asset_dep').select('*')]);
 if(aq.error){if(noTable(aq.error))return need(m,'016 and 017_stock_fixed_assets.sql','The fixed-asset register');throw aq.error}
 const A=(aq.data||[]).filter(x=>!x.voided),D=dq.data||[],dep=id=>D.filter(d=>d.asset_id===id).reduce((s,d)=>s+paise(d.amount),0);
 const pay=L.accts.filter(a=>a.is_active!==false&&!['receivables','payables','fixed_assets','acc_dep'].includes(a.system_key)&&(a.type==='asset'||a.type==='liability'||a.type==='equity'||a.system_key==='purchases'));
 const t=TP.fyOf(today()),last=(+t.start.slice(0,4)-1),fys=[];for(let y=last;y>=last-6;y--)fys.push(y+'-04-01');fyp=fyp||fys[0];
 const tot=A.reduce((s,x)=>({c:s.c+paise(x.cost),a:s.a+paise(x.opening_acc_dep)+dep(x.id)}),{c:0,a:0});
 m.innerHTML=`<div class="row c4"><div class=card><div class=k>Cost</div><div class=v>${inr2(rup(tot.c))}</div></div><div class=card><div class=k>Accumulated depreciation</div><div class=v>${inr2(rup(tot.a))}</div></div><div class=card><div class=k>Net book value</div><div class=v>${inr2(rup(tot.c-tot.a))}</div></div></div>
 <div class=card><h3>Add a fixed asset</h3><p class=k>Posts <i>Dr Fixed assets</i> at cost against the account you choose: your bank/cash, <b>Purchases</b> (to move a bill you already booked as a purchase), <b>Opening balance equity</b> (assets you already owned), or another non-debtor/creditor account. Method, life and rate are <b>your</b> inputs (company law / accounting policy); the system does not look up rates. Depreciation runs from the date put to use, in days. Income-tax block depreciation is separate and not computed here. For an asset owned before your books, enter depreciation already charged; depreciation then starts from the year you pick.</p>
 <form id=f class=g2><label>Asset name<input name=name required></label><label>Class<input name=cls placeholder="Plant, Computer, Furniture"></label>
 <label>Date put to use<input type=date name=use value="${today()}" required></label><label>Cost (₹)<input name=cost type=number min=0.01 step=0.01 required></label>
 <label>Residual value (₹)<input name=res type=number min=0 step=0.01 value=0></label><label>Method<select name=method><option value=slm>Straight line (SLM)<option value=wdv>Written down value (WDV)</select></label>
 <label id=lifeL>Useful life (years)<input name=life type=number min=0.01 step=0.01></label><label id=rateL hidden>Rate % per year<input name=rate type=number min=0.01 max=100 step=0.001></label>
 <label class=full>Paid from / credited to<select name=acc required>${pay.map(a=>`<option value="${a.id}">${esc(a.code+' '+TP.fullName(a,L.accts))}</option>`).join('')}</select></label>
 <label>Depreciation already charged (₹, owned before books)<input name=oad type=number min=0 step=0.01 value=0></label><label>Depreciate from financial year starting<input type=date name=from></label>
 <div class="f2 full"><button>Add asset</button></div></form></div>
 <div class=card><h3>Register</h3><table><tr><th>Asset<th>Put to use<th>Method<th class=r>Cost<th class=r>Accumulated<th class=r>Net book value<th></tr>${A.map(x=>`<tr><td>${esc(x.name)}<br><span class=k>${esc(x.asset_class||'')}</span><td>${x.put_to_use}<td>${x.method==='slm'?'SLM '+x.life_years+' yrs':'WDV '+x.rate_pct+'%'}<td class=r>${inr2(x.cost)}<td class=r>${inr2(rup(paise(x.opening_acc_dep)+dep(x.id)))}<td class=r>${inr2(rup(paise(x.cost)-paise(x.opening_acc_dep)-dep(x.id)))}<td>${D.some(d=>d.asset_id===x.id)?'':`<button class=x data-v="${x.id}">Cancel</button>`}</tr>`).join('')||'<tr><td colspan=7>No assets yet.</tr>'}</table></div>
 <div class=card><h3>Depreciation for a finished financial year</h3><p class=k>One journal per year (Dr Depreciation, Cr Accumulated depreciation, dated 31 March). Years must be posted in order. A year already posted is skipped, so it is safe to repeat.</p>
 <form id=pf style="display:flex;gap:12px;flex-wrap:wrap;align-items:end"><label>Financial year<select name=fy>${fys.map(y=>`<option value="${y}" ${y===fyp?'selected':''}>FY ${TP.fyOf(y).label}</option>`).join('')}</select></label><button type=button class=g id=pv>Preview</button><button>Post depreciation</button></form><div id=pvr></div></div>`;
 const f=$('#f'),e=f.elements,tg=()=>{const s=e.method.value==='slm';$('#lifeL').hidden=!s;$('#rateL').hidden=s};e.method.onchange=tg;tg();
 f.onsubmit=ev=>{ev.preventDefault();return guard(f,async()=>{if(await lockedBlock(e.use.value))return;
  const r=await db.rpc('add_fixed_asset',{p_name:e.name.value,p_class:e.cls.value||null,p_put_to_use:e.use.value,p_cost:rup(paise(e.cost.value)),p_residual:rup(paise(e.res.value)),p_method:e.method.value,p_life:e.method.value==='slm'?+e.life.value||null:null,p_rate:e.method.value==='wdv'?+e.rate.value||null:null,p_credit_account:e.acc.value,p_note:null,p_date:null,p_opening_acc_dep:rup(paise(e.oad.value)),p_dep_from:e.from.value||null});
  if(r.error)return alert(r.error.message);toast('Asset added');render(m)})};
 $('#pv').onclick=async()=>{fyp=$('#pf').elements.fy.value;const r=await db.rpc('preview_depreciation',{p_fy_start:fyp});if(r.error)return alert(r.error.message);
  $('#pvr').innerHTML=`<table class=sm>${(r.data||[]).map(x=>`<tr><td>${esc(x.name)}<td class=r>${inr2(x.amount)}</tr>`).join('')||'<tr><td>Nothing pending for this year.</tr>'}</table>`};
 $('#pf').onsubmit=ev=>{ev.preventDefault();const pf=$('#pf');return guard(pf,async()=>{fyp=pf.elements.fy.value;if(!confirm('Post depreciation for FY '+TP.fyOf(fyp).label+'?'))return;if(await lockedBlock(TP.fyOf(fyp).end))return;
  const r=await db.rpc('post_depreciation',{p_fy_start:fyp});if(r.error)return alert(r.error.message);toast(r.data&&r.data.journal_id?'Depreciation posted: '+inr2(r.data.total):(r.data&&r.data.message)||'Nothing to post');render(m)})};
 m.querySelectorAll('[data-v]').forEach(b=>b.onclick=async()=>{const why=prompt('Reason for cancelling this asset (its purchase entry is reversed)?');if(!why)return;const r=await db.rpc('void_fixed_asset',{p_id:b.dataset.v,p_reason:why,p_date:today()});if(r.error)return alert(r.error.message);render(m)});
},'fixed-assets.html');
</script></body></html>
