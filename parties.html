<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toolkit Pro</title><link rel="stylesheet" href="assets/app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="assets/app.js"></script></head><body><script>
const kind=new URLSearchParams(location.search).get('kind')==='supplier'?'supplier':'client',sale=kind==='client'?'sale':'purchase';
boot(kind==='client'?'Clients & Sales':'Suppliers & Purchases',async m=>{
 const{p,i,a,S}=await load();const ps=p.filter(x=>x.kind===kind),iv=i.filter(x=>x.kind===sale&&ps.some(y=>y.id===x.party_id));
 const P=id=>ps.find(x=>x.id===id)||{},out=x=>x.amount-x.paid;
 const st=x=>out(x)<=0?'Paid':x.due_date?due(x.due_date):'Open';
 m.innerHTML=`<div class=card><h3>Add ${kind}</h3><form class=f id=f1><input name=name placeholder=Name required><input name=email type=email placeholder=Email><input name=phone placeholder=Phone><input name=gstin placeholder=GSTIN><input name=state placeholder="State (for GST)"><button>Save ${kind}</button></form></div>
 <div class=card><h3>New ${sale} invoice</h3><form class=f id=f2><select name=party_id required><option value="">Select ${kind}${ps.map(x=>`<option value="${x.id}">${esc(x.name)}`).join('')}</select><input name=number placeholder="Invoice no." required><input type=date name=date value="${today()}" required><input type=date name=due_date><input name=taxable type=number min=0.01 step=0.01 placeholder="Taxable value (₹)" required><select name=gst_rate title="GST rate">${RATES.map(r=>`<option ${r==(S.default_gst??18)?'selected':''}>${r}`).join('')}</select><button>Save invoice</button></form></div>
 <div class=card><h3>Invoices &nbsp;<span class=k>Settle into</span> <select id=pa>${a.map(x=>`<option value="${x.id}">${esc(x.name)}`).join('')||'<option value="">No account'}</select> ${iv.some(x=>x.taxable==null)?'<button class=g id=gall>Set GST on old invoices</button>':''}</h3><table><tr><th>No.<th>${kind}<th>Date<th>Amount<th>Outstanding<th>Status<th></tr>${iv.map(x=>`<tr><td>${esc(x.number)}<td>${esc(P(x.party_id).name)}<td>${x.date}<td>${inr(x.amount)}<br><small class=k>GST ${inr(taxOf(x))}</small><td>${inr(out(x))}<td>${st(x)}<td>${out(x)>0?`<button data-pay="${x.id}">${sale==='sale'?'Record receipt':'Record payment'}</button> <button class=g data-mail="${x.id}">Mail</button> `:''}${x.taxable==null?`<button class=g data-gst="${x.id}">Set GST</button> `:''}<button class=x data-di="${x.id}">Delete</button></tr>`).join('')||'<tr><td colspan=7>No invoices yet.</tr>'}</table></div>
 <div class=card><h3>${kind==='client'?'Clients':'Suppliers'}</h3><table><tr><th>Name<th>Email<th>Phone<th>Outstanding<th></tr>${ps.map(x=>`<tr><td>${esc(x.name)}<td>${esc(x.email)}<td>${esc(x.phone)}<td>${inr(iv.filter(y=>y.party_id===x.id).reduce((s,y)=>s+out(y),0))}<td><button class=x data-dp="${x.id}">Delete</button></tr>`).join('')||'<tr><td colspan=5>No ${kind}s yet.</tr>'}</table></div>`;
 const fd=f=>Object.fromEntries([...new FormData($(f))].filter(e=>e[1]!==''));
 $('#f1').onsubmit=async e=>{e.preventDefault();if(await ok(db.from('parties').insert({...fd('#f1'),kind})))$('#f1').reset()};
 $('#f2').onsubmit=async e=>{e.preventDefault();const d=fd('#f2'),tv=+d.taxable,rt=+d.gst_rate||0,g=gst(tv,rt,S,P(d.party_id)),amount=+(tv+g.cgst+g.sgst+g.igst).toFixed(2);if(await ok(db.from('invoices').insert({party_id:d.party_id,number:d.number,date:d.date,due_date:d.due_date||null,taxable:tv,gst_rate:rt,...g,amount,kind:sale})))$('#f2').reset()};
 m.querySelectorAll('[data-pay]').forEach(b=>b.onclick=async()=>{const x=iv.find(y=>y.id===b.dataset.pay),amt=Math.min(+prompt('Amount (₹)',out(x)),out(x));if(!(amt>0))return;
  if(!(await ok(db.from('transactions').insert({description:(sale==='sale'?'Receipt ':'Payment ')+x.number+' - '+P(x.party_id).name,category:sale==='sale'?'Sales':'Purchases',type:sale==='sale'?'income':'expense',amount:amt,account_id:$('#pa').value||null,invoice_id:x.id}))))return;
  await ok(db.from('invoices').update({paid:+x.paid+amt}).eq('id',x.id))});
 m.querySelectorAll('[data-mail]').forEach(b=>b.onclick=()=>{const x=iv.find(y=>y.id===b.dataset.mail),n=P(x.party_id).name;
  mail(P(x.party_id).email,(sale==='sale'?'Payment reminder: invoice ':'Payment update: invoice ')+x.number,`Dear ${n},\n\n${sale==='sale'?`This is a gentle reminder that invoice ${x.number} dated ${x.date} for ${inr(x.amount)} has ${inr(out(x))} outstanding${x.due_date?', due on '+x.due_date:''}. Kindly arrange payment at the earliest.`:`We are processing payment against your invoice ${x.number} dated ${x.date}. Outstanding: ${inr(out(x))}.`}\n\nRegards,\nShree Digitax Solutions`)});
 m.querySelectorAll('[data-di]').forEach(b=>b.onclick=()=>confirm('Delete this invoice?')&&ok(db.from('invoices').delete().eq('id',b.dataset.di)));
 m.querySelectorAll('[data-dp]').forEach(b=>b.onclick=()=>confirm('Delete this contact and its invoices?')&&ok(db.from('parties').delete().eq('id',b.dataset.dp)));
 const fix=async list=>{const ans=prompt('GST rate % for these invoices (0, 5, 12, 18, 28)',S.default_gst??18);if(ans===null)return;const r=+ans;if(!RATES.includes(r))return alert('Enter one of: '+RATES.join(', '));
  const incl=confirm('Do the existing invoice amounts already include GST?\nOK = included (total stays the same)\nCancel = GST is extra (total increases)');
  for(const x of list){const a=+x.amount,tv=incl?+(a/(1+r/100)).toFixed(2):a,g=gst(tv,r,S,P(x.party_id)),tax=incl?+(a-tv).toFixed(2):g.cgst+g.sgst+g.igst,c=g.igst?{cgst:0,sgst:0,igst:tax}:{cgst:+(tax/2).toFixed(2),sgst:+(tax/2).toFixed(2),igst:0};
   if(!(await ok(db.from('invoices').update({taxable:tv,gst_rate:r,...c,amount:+(tv+tax).toFixed(2)}).eq('id',x.id))))return}toast('GST updated')};
 m.querySelectorAll('[data-gst]').forEach(b=>b.onclick=()=>fix([iv.find(y=>y.id===b.dataset.gst)]));
 if($('#gall'))$('#gall').onclick=()=>fix(iv.filter(x=>x.taxable==null));
});
</script></body></html>
