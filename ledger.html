<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toolkit Pro</title><link rel="preconnect" href="https://dpgkabvyappujokiujoh.supabase.co" crossorigin><link rel="stylesheet" href="assets/app.css?v=20261101"><script src="assets/vendor/supabase.js?v=20261101"></script><script src="assets/app.js?v=20261101"></script><script src="assets/reports-lib.js?v=20261101"></script></head><body><script>
const book=Q.get('book')==='cash';let acc=Q.get('acc')||'',from=Q.get('from')??TP.fyStart(today()),to=Q.get('to')??today();
boot(book?'Cash & Bank Book':'General Ledger',async function render(m){
 const L=await loadLedger();if(ledgerGate(m,L))return;const{i}=await load();
 const list=L.accts.filter(a=>book?(a.bank_account_id||a.system_key==='cash'):true).sort((a,b)=>String(a.code).localeCompare(String(b.code),undefined,{numeric:true}));
 if(!list.length){m.innerHTML='<div class=card>No accounts to show.</div>';return}
 if(!list.some(a=>a.id===acc))acc=list[0].id;
 const a=list.find(x=>x.id===acc),g=TP.generalLedger(a,L.lines,from||null,to||null),cashbook=book;
 const dc=cashbook?['Receipts','Payments']:['Debit','Credit'];
 m.innerHTML=`<form id=f class="card noprint" style="display:flex;flex-wrap:wrap;gap:12px;align-items:end"><label>${cashbook?'Account':'Ledger account'}<select name=acc>${list.map(x=>`<option value="${x.id}" ${x.id===acc?'selected':''}>${esc(x.code+' '+TP.fullName(x,L.accts))}</option>`).join('')}</select></label><label>From<input type=date name=from value="${esc(from)}"></label><label>To<input type=date name=to value="${esc(to)}"></label><button>Apply</button><button type=button class=g id=fy>This financial year</button><button type=button class=g id=all>All dates</button></form>
 <div class="row c4 rep"><div class=card><div class=k>Opening balance</div><div class=v>${inr2(g.opening)} <small>${g.openingSide}</small></div></div><div class=card><div class=k>Total ${dc[0].toLowerCase()}</div><div class=v>${inr2(g.totalDebit)}</div></div><div class=card><div class=k>Total ${dc[1].toLowerCase()}</div><div class=v>${inr2(g.totalCredit)}</div></div><div class=card><div class=k>Closing balance</div><div class=v>${inr2(g.closing)} <small>${g.closingSide}</small></div></div></div>
 <div class=card><div class="f2 noprint" style="justify-content:flex-end;margin-bottom:8px"><button class=g id=csv>Export CSV</button><button class=g id=pr>Print</button></div>
 <h3>${esc(a.code+' '+TP.fullName(a,L.accts))}</h3><table class=rpt><caption class=sr>Ledger for ${esc(a.name)}</caption><thead><tr><th scope=col>Date<th scope=col>Journal<th scope=col>Narration<th scope=col class=r>${dc[0]}<th scope=col class=r>${dc[1]}<th scope=col class=r>Balance</tr></thead><tbody>
 <tr><td>${from||''}<td colspan=4><i>Opening balance</i><td class=r>${inr2(g.opening)} ${g.openingSide}</tr>
 ${g.rows.map(r=>{const u=jsrc(r.sourceTable,r.sourceId,i);return`<tr><td>${r.date}<td>${TP.jno(r.journalNo)}<td>${u?`<a href="${u}">${esc(r.narration)}</a>`:esc(r.narration)}${r.kind==='reversal'?' <span class=k>(reversal)</span>':''}<td class=r>${r.debit?inr2(r.debit):''}<td class=r>${r.credit?inr2(r.credit):''}<td class=r>${inr2(r.balance)} ${r.side}</tr>`}).join('')||'<tr><td colspan=6>No entries in this period.</tr>'}
 </tbody><tfoot><tr><th scope=row colspan=3>Closing balance</th><td class=r><b>${inr2(g.totalDebit)}</b><td class=r><b>${inr2(g.totalCredit)}</b><td class=r><b>${inr2(g.closing)} ${g.closingSide}</b></tr></tfoot></table></div>`;
 $('#f').onsubmit=e=>{e.preventDefault();const d=new FormData($('#f'));acc=d.get('acc');from=d.get('from')||'';to=d.get('to')||'';if(from&&to&&from>to)return alert('"From" date must be on or before "To" date.');render(m)};
 $('#fy').onclick=()=>{from=TP.fyStart(today());to=today();render(m)};$('#all').onclick=()=>{from='';to='';render(m)};$('#pr').onclick=()=>window.print();
 $('#csv').onclick=()=>TP.download((cashbook?'cash-book-':'ledger-')+a.code+'-'+(to||today())+'.csv',[['Date','Journal','Narration',dc[0],dc[1],'Balance','Dr/Cr'],['','','Opening balance','','',g.opening,g.openingSide],...g.rows.map(r=>[r.date,TP.jno(r.journalNo),r.narration,r.debit||'',r.credit||'',r.balance,r.side]),['','','Closing balance',g.totalDebit,g.totalCredit,g.closing,g.closingSide]]);
},Q.get('book')==='cash'?'ledger.html?book=cash':'ledger.html');
</script></body></html>
