<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toolkit Pro</title><link rel="preconnect" href="https://dpgkabvyappujokiujoh.supabase.co" crossorigin><link rel="stylesheet" href="assets/app.css?v=20261024"><script src="assets/vendor/supabase.js?v=20261024"></script><script src="assets/app.js?v=20261024"></script></head><body><script>
boot('Banking & Accounts',async m=>{
 const{a,t}=await load(),b=bal(a,t);
 m.innerHTML=`<div class=card><h3>Add account</h3><form class=f id=f><input name=name placeholder="Account name (e.g. HDFC Bank)" required><input name=opening type=number step=0.01 placeholder="Opening balance (₹)" value=0><button>Save account</button></form></div>
 <div class=card><table><tr><th>Account<th class=r>Opening<th class=r>Inflows<th class=r>Outflows<th class=r>Balance<th></tr>${b.map(x=>`<tr><td>${esc(x.name)}<td class=r>${inr(x.opening)}<td class="r up">${inr(x.inc)}<td class="r dn">${inr(x.exp)}<td class=r><b>${inr(x.bal)}</b><td><button class=g data-e="${x.id}">Edit</button><button class=x data-id="${x.id}">Delete</button></tr>`).join('')||'<tr><td colspan=6>No accounts yet.</tr>'}<tr><td colspan=4><b>Total</b><td class=r><b>${inr(b.reduce((s,x)=>s+x.bal,0))}</b><td></tr></table></div>`;
 $('#f').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData($('#f')));if(await ok(db.from('accounts').insert({name:d.name,opening:+d.opening||0}))){$('#f').reset();refresh()}};
 m.querySelectorAll('[data-e]').forEach(x=>x.onclick=()=>editBox('Edit account',[{n:'name',l:'Account name',req:1,full:1},{n:'opening',l:'Opening balance (₹)',t:'number',step:'0.01',full:1}],a.find(y=>y.id===x.dataset.e),d=>ok(db.from('accounts').update({name:d.name,opening:+d.opening||0}).eq('id',x.dataset.e))).then(()=>refresh()));
 m.querySelectorAll('.x').forEach(x=>x.onclick=async()=>{if(confirm('Delete this account? Its transactions stay but become unassigned.')&&await ok(db.from('accounts').delete().eq('id',x.dataset.id)))refresh()});
});
</script></body></html>
