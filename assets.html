<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toolkit Pro</title><link rel="preconnect" href="https://dpgkabvyappujokiujoh.supabase.co" crossorigin><link rel="stylesheet" href="assets/app.css?v=20261102"><script src="assets/vendor/supabase.js?v=20261102"></script><script src="assets/app.js?v=20261102"></script></head><body><script>
const CATS=['Investments','Fixed Assets','Cash in Hand','Other'];
boot('Assets & Investments',async m=>{
 const{h}=await load();
 m.innerHTML=`<div class=card><h3>Add asset or investment</h3><form class=f id=f><input name=name placeholder="Name" required><select name=category>${CATS.map(c=>`<option>${c}`).join('')}</select><input name=value type=number min=0 step=0.01 placeholder="Value (₹)" required><button>Save asset</button></form></div>
 <div class=card><table><tr><th>Name<th>Category<th class=r>Value<th></tr>${h.map(x=>`<tr><td>${esc(x.name)}<td>${esc(x.category)}<td class=r>${inr(x.value)}<td><button class=g data-e="${x.id}">Edit</button><button class=x data-id="${x.id}">Delete</button></tr>`).join('')||'<tr><td colspan=4>No assets yet. These feed the dashboard portfolio chart.</tr>'}</table></div>`;
 $('#f').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData($('#f')));if(await ok(db.from('assets').insert({...d,value:+d.value}))){$('#f').reset();refresh()}};
 m.querySelectorAll('[data-e]').forEach(x=>x.onclick=()=>editBox('Edit asset',[{n:'name',l:'Name',req:1,full:1},{n:'category',l:'Category',opts:CATS},{n:'value',l:'Value (₹)',t:'number',step:'0.01',min:0,req:1}],h.find(y=>y.id===x.dataset.e),d=>ok(db.from('assets').update({name:d.name,category:d.category,value:+d.value}).eq('id',x.dataset.e))).then(()=>refresh()));
 m.querySelectorAll('.x').forEach(x=>x.onclick=async()=>{if(confirm('Delete this asset?')&&await ok(db.from('assets').delete().eq('id',x.dataset.id)))refresh()});
});
</script></body></html>
