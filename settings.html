<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toolkit Pro</title><link rel="preconnect" href="https://dpgkabvyappujokiujoh.supabase.co" crossorigin><link rel="stylesheet" href="assets/app.css?v=20261102"><script src="assets/vendor/supabase.js?v=20261102"></script><script src="assets/app.js?v=20261102"></script><script src="assets/gst-fields.js?v=20261102"></script><script src="assets/doc-series.js?v=20261102"></script><script src="assets/settings-tools.js?v=20261102"></script></head><body><script>
boot('Settings',async m=>{
 const{S}=await load(),v=k=>esc(S[k]||'');
 m.innerHTML=`<div class=card><h3>Business profile</h3><form class=f id=f><h4 class=fh id=company>Company profile</h4><input name=business_name placeholder="Business name" value="${v('business_name')}"><input name=phone placeholder=Phone value="${v('phone')}"><input name=email type=email placeholder="Business email" value="${v('email')}"><input name=address placeholder="Address (building, street, area)" value="${v('address')}"><input name=city placeholder="City / town" value="${v('city')}"><input name=pincode placeholder="PIN code" inputmode=numeric maxlength=6 value="${v('pincode')}"><h4 class=fh id=gst>Business &amp; GST details</h4><input name=gstin placeholder=GSTIN value="${v('gstin')}"><select name=state title="State (decides CGST/SGST vs IGST)">${GF.stateOpts(S.state).map(o=>`<option value="${esc(o[0])}" ${GF.canonState(S.state)===o[0]?'selected':''}>${esc(o[1])}</option>`).join('')}</select><input name=pan placeholder="PAN (e.g. ABCDE1234F)" maxlength=10 value="${v('pan')}"><select name=default_gst title="Default GST rate">${RATES.map(r=>`<option ${r==(S.default_gst??18)?'selected':''}>${r}`).join('')}</select><h4 class=fh id=invoice>Invoice &amp; PDF details (printed on every Tax Invoice and statement)</h4><input name=default_hsn placeholder="Default HSN / SAC code for new invoices (e.g. 998231)" value="${v('default_hsn')}"><input name=signatory placeholder="Authorised signatory name" value="${v('signatory')}"><input name=bank_name placeholder="Bank name and branch" value="${v('bank_name')}"><input name=bank_account placeholder="Bank account number" value="${v('bank_account')}"><input name=bank_ifsc placeholder="IFSC code" maxlength=11 value="${v('bank_ifsc')}"><input name=upi_id placeholder="UPI ID (optional)" value="${v('upi_id')}"><textarea name=terms rows=3 placeholder="Terms &amp; conditions printed on invoices (optional)" style="width:100%;grid-column:1/-1;font:inherit;padding:7px 10px;border:1px solid #d5dbec;border-radius:8px;box-sizing:border-box">${v('terms')}</textarea><button>Save settings</button></form></div>
 <div class=card id=series></div>
 <div class=card id=voice></div>
 <div class=card id=app><h3>Email</h3><p class=k>Emails are sent by the send-mail function on your Supabase project. Send yourself a test to confirm it works.</p><button class=g id=tm>Send test email</button></div>
 <div class=card id=reset style="border-color:#f0b8b2"></div>`;
 ST.mountSeries($('#series'),S).catch(e=>{$('#series').innerHTML='<h3>Document numbering</h3><p>Could not load: '+esc(e.message||e)+'</p>'});ST.mountReset($('#reset'));
 $('#f').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData($('#f')));d.default_gst=+d.default_gst;if(d.gstin)d.gstin=d.gstin.trim().toUpperCase();if(d.pan)d.pan=d.pan.trim().toUpperCase();if(d.bank_ifsc)d.bank_ifsc=d.bank_ifsc.trim().toUpperCase();if(!gstinGate(d.gstin))return;
  if(d.pan&&!GF.PAN_RE.test(d.pan))return alert('PAN must look like ABCDE1234F.');if(d.pincode&&!GF.PIN_RE.test(d.pincode.trim()))return alert('PIN code must be 6 digits.');
  const r=await GF.saveCompat(row=>S.id?db.from('settings').update(row).eq('id',S.id):db.from('settings').insert(row),d,GF.SETTINGS_NEW);if(r.error)return alert(r.error.message);
  if(r.dropped&&(r.lost||[]).length)alert('Saved, but these fields were not stored because migration 020 has not been run in Supabase yet: '+r.lost.join(', ')+'.');else toast('Settings saved')};
 if(typeof loadVoice==='function')loadVoice().then(()=>{if(window.VoiceUI)VoiceUI.mountSettings($('#voice'))});else $('#voice').innerHTML='<h3>Voice assistant</h3><p class=k>Voice files are out of date on this site. Upload the latest assets/app.js, voice-core.js and voice.js, then hard-refresh.</p>';
 $('#tm').onclick=()=>mail(S.email,'Toolkit Pro test email','This is a test email from Toolkit Pro.');
});
</script></body></html>
