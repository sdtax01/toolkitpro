<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toolkit Pro</title><link rel="preconnect" href="https://dpgkabvyappujokiujoh.supabase.co" crossorigin><link rel="stylesheet" href="assets/app.css?v=20261024"><script src="assets/vendor/supabase.js?v=20261024"></script><script src="assets/app.js?v=20261024"></script></head><body><script>
boot('Goals',async m=>{
 const{g}=await load();
 m.innerHTML=`<div class=card><h3>Add goal</h3><form class=f id=f><input name=name placeholder="Goal (e.g. New office)" required><input name=target type=number min=1 placeholder="Target (₹)" required><input name=target_date type=date><button>Save goal</button></form></div>
 <div class=card><table><tr><th>Goal<th class=r>Saved<th class=r>Target<th>Progress<th>Target date<th></tr>${g.map(x=>`<tr><td>${esc(x.name)}<td class=r>${inr(x.saved)}<td class=r>${inr(x.target)}<td>${bar(x.saved,x.target)}<small class=k>${Math.round(x.saved/x.target*100)}%</small><td>${x.target_date||''}<td><button data-add="${x.id}">Add savings</button> <button class=g data-e="${x.id}">Edit</button><button class=x data-id="${x.id}">Delete</button></tr>`).join('')||'<tr><td colspan=6>No goals yet.</tr>'}</table></div>`;
 $('#f').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries([...new FormData($('#f'))].filter(e=>e[1]!==''));if(await ok(db.from('goals').insert({...d,target:+d.target}))){$('#f').reset();refresh()}};
 m.querySelectorAll('[data-add]').forEach(b=>b.onclick=async()=>{const x=g.find(y=>y.id===b.dataset.add),n=+prompt('Amount to add (₹)',0);if(n>0&&await ok(db.from('goals').update({saved:+x.saved+n}).eq('id',x.id)))refresh()});
 m.querySelectorAll('[data-e]').forEach(x=>x.onclick=()=>editBox('Edit goal',[{n:'name',l:'Goal',req:1,full:1},{n:'target',l:'Target (₹)',t:'number',min:1,step:'0.01',req:1},{n:'saved',l:'Saved so far (₹)',t:'number',min:0,step:'0.01'},{n:'target_date',l:'Target date',t:'date',full:1}],g.find(y=>y.id===x.dataset.e),d=>ok(db.from('goals').update({name:d.name,target:+d.target,saved:+d.saved||0,target_date:d.target_date||null}).eq('id',x.dataset.e))).then(()=>refresh()));
 m.querySelectorAll('.x').forEach(x=>x.onclick=async()=>{if(confirm('Delete this goal?')&&await ok(db.from('goals').delete().eq('id',x.dataset.id)))refresh()});
});
</script></body></html>
