<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toolkit Pro</title><link rel="stylesheet" href="assets/app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="assets/app.js"></script></head><body><script>
boot('Goals',async m=>{
 const{g}=await load();
 m.innerHTML=`<div class=card><h3>Add goal</h3><form class=f id=f><input name=name placeholder="Goal (e.g. New office)" required><input name=target type=number min=1 placeholder="Target (₹)" required><input name=target_date type=date><button>Save goal</button></form></div>
 <div class=card><table><tr><th>Goal<th class=r>Saved<th class=r>Target<th>Progress<th>Target date<th></tr>${g.map(x=>`<tr><td>${esc(x.name)}<td class=r>${inr(x.saved)}<td class=r>${inr(x.target)}<td>${bar(x.saved,x.target)}<small class=k>${Math.round(x.saved/x.target*100)}%</small><td>${x.target_date||''}<td><button data-add="${x.id}">Add savings</button> <button class=x data-id="${x.id}">Delete</button></tr>`).join('')||'<tr><td colspan=6>No goals yet.</tr>'}</table></div>`;
 $('#f').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries([...new FormData($('#f'))].filter(e=>e[1]!==''));if(await ok(db.from('goals').insert({...d,target:+d.target})))$('#f').reset()};
 m.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const x=g.find(y=>y.id===b.dataset.add),n=+prompt('Amount to add (₹)',0);if(n>0)ok(db.from('goals').update({saved:+x.saved+n}).eq('id',x.id))});
 m.querySelectorAll('.x').forEach(x=>x.onclick=()=>confirm('Delete this goal?')&&ok(db.from('goals').delete().eq('id',x.dataset.id)));
});
</script></body></html>
